services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: patchwork
      POSTGRES_DB: patchwork
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env.pocketid
    ports:
      - 1411:1411
    volumes:
      - "./.pocketid-data:/app/data"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocket-id

volumes:
  db_data:
  caddy_data:
  caddy_config:
